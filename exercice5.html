<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Création d'un Tableau</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
        }
        td, th {
            border: 1px solid #333;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Tableau des Formations D-CLIC</h1>
    
    <table>
        <tr>
            <th>Formation</th>
            <th>Durée</th>
            <th>Niveau</th>
        </tr>
        <tr>
            <td>Développement Web</td>
            <td>6 mois</td>
            <td>Débutant</td>
        </tr>
        <tr>
            <td>Cybersécurité</td>
            <td>4 mois</td>
            <td>Intermédiaire</td>
        </tr>
        <tr>
            <td>Intelligence Artificielle</td>
            <td>5 mois</td>
            <td>Avancé</td>
        </tr>
        <tr>
            <td>Marketing Numérique</td>
            <td>3 mois</td>
            <td>Débutant</td>
        </tr>
    </table>
</body>
</html>
